[project]
name = "strokegen"
version = "0.1.0"
description = "Cut CJK glyph outline SVGs into strokes and emit hanzi-writer data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "shapely",
    "pycairo",
    "torch",
    "tqdm",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["strokegen"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["tools/scratch", "training_data/hanzi-writer-data-youyin"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E741",  # l / I as loop names in geometry code
    "B905",  # zip() over lists that have the same length by construction
]

[tool.ruff.lint.per-file-ignores]
"strokegen/evaluate.py" = ["E501"]  # the HTML / CSS / JS preview template

[tool.ruff.lint.isort]
known-first-party = ["strokegen", "tools"]
